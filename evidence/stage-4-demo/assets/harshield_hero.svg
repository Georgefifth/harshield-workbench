    <text x="312" y="252" fill="#F1F5F9">Token A → JWT_TOKEN_#1</text>
    <text x="312" y="268" fill="#F1F5F9">Token B → JWT_TOKEN_#2</text>

    <rect x="302" y="294" width="196" height="56" rx="5" fill="#0A0D12" stroke="#F59E0B" stroke-width="1.2" />
