    <text x="312" y="334" fill="#94A3B8">Links Issued → 401 Hop</text>

    <rect x="302" y="362" width="196" height="54" rx="5" fill="#0A0D12" stroke="#06B6D4" stroke-width="1.2" />
    <text x="312" y="382" fill="#06B6D4" font-weight="700">4. Size &amp; JSON Verifier</text>
    <text x="312" y="400" fill="#10B981">JSON.parse() 100% PASS</text>
  </g>

