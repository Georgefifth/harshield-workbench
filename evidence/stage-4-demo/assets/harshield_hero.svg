  </text>

  <g font-family="JetBrains Mono, monospace" font-size="11">
    <rect x="302" y="142" width="196" height="58" rx="5" fill="#0A0D12" stroke="#06B6D4" stroke-width="1.2" />
    <text x="312" y="162" fill="#F1F5F9" font-weight="700">1. Deep MIME Unwrapper</text>
    <text x="312" y="180" fill="#94A3B8">JSON · Form · Base64</text>
