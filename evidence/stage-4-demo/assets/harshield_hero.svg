  </text>

  <g font-family="JetBrains Mono, monospace" font-size="11">
    <rect x="572" y="140" width="182" height="52" rx="4" fill="#0A0D12" stroke="#10B981" stroke-opacity="0.5" />
    <text x="580" y="158" fill="#94A3B8">Sanitized Header:</text>
    <text x="580" y="178" fill="#10B981" font-weight="700">Bearer JWT_TOKEN_#1</text>

    <rect x="572" y="204" width="182" height="52" rx="4" fill="#0A0D12" stroke="#10B981" stroke-opacity="0.5" />
