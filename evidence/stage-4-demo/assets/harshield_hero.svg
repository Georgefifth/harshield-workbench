    <text x="54" y="176" fill="#EF4444">Bearer eyJhbGciOiJ...</text>

    <rect x="46" y="200" width="182" height="54" rx="4" fill="#0A0D12" stroke="#232E3F" />
    <text x="54" y="218" fill="#94A3B8">POST Form (#17):</text>
    <text x="54" y="236" fill="#EF4444">password=Sup3rS3cret!</text>

    <rect x="46" y="266" width="182" height="68" rx="4" fill="#0A0D12" stroke="#232E3F" />
    <text x="54" y="284" fill="#94A3B8">JSON Response (#27):</text>
    <text x="54" y="302" fill="#EF4444">"access_token":"eyJ..."</text>
    <text x="54" y="320" fill="#EF4444">"refresh_token":"rt_99"</text>

    <rect x="46" y="346" width="182" height="68" rx="4" fill="#0A0D12" stroke="#232E3F" />
    <text x="54" y="364" fill="#94A3B8">Nested URL (#44):</text>
    <text x="54" y="382" fill="#EF4444">?X-Amz-Signature=9f86</text>
    <text x="54" y="400" fill="#F59E0B">+ 60% Static Noise</text>
  </g>

  <!-- Center Box: HARshield Recursive AST & Pseudonymizer Core -->
  <rect x="286" y="92" width="228" height="340" rx="8" fill="#18202C" stroke="#06B6D4" stroke-width="2.5" />
  <rect x="286" y="92" width="228" height="34" rx="8" fill="#06B6D4" fill-opacity="0.2" />
  <text x="302" y="114" fill="#06B6D4" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">
