    <text x="580" y="286" fill="#94A3B8">Presigned URL (#44):</text>
    <text x="580" y="306" fill="#10B981" font-weight="700">?X-Amz-Sig=SIG_#1</text>

    <rect x="572" y="332" width="182" height="82" rx="4" fill="#10B981" fill-opacity="0.12" stroke="#10B981" />
    <text x="580" y="352" fill="#F1F5F9" font-weight="700">Export Formats:</text>
    <text x="580" y="370" fill="#10B981">✓ .sanitized.har</text>
    <text x="580" y="388" fill="#10B981">✓ Redacted cURL (.sh)</text>
    <text x="580" y="406" fill="#10B981">✓ Playwright (.spec.ts)</text>
  </g>

  <!-- Connecting Arrows -->
  <line x1="244" y1="262" x2="282" y2="262" stroke="#06B6D4" stroke-width="3" marker-end="url(#arrowCyan)" />
  <line x1="516" y1="262" x2="554" y2="262" stroke="#10B981" stroke-width="3" marker-end="url(#arrowGreen)" />

  <!-- Bottom Benchmark Footer Strip -->
  <rect x="32" y="454" width="736" height="80" rx="8" fill="#11161F" stroke="#232E3F" stroke-width="1.5" />
  <text x="52" y="482" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">
