  </text>

  <!-- Left Box: Raw Unsanitized HAR Input -->
  <rect x="32" y="92" width="210" height="340" rx="8" fill="#11161F" stroke="#EF4444" stroke-width="2" />
  <rect x="32" y="92" width="210" height="34" rx="8" fill="#EF4444" fill-opacity="0.18" />
  <text x="46" y="114" fill="#EF4444" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">
